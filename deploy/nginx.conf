# Quicklinks — nginx site config
# Copy to /etc/nginx/sites-available/quicklinks, symlink into sites-enabled,
# then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name quicklinks.corp.local;   # change to your internal hostname

    # Recommended: serve over HTTPS with a cert from your internal CA.
    # (The copy buttons work either way, but HTTPS is cleaner.)
    # listen 443 ssl;
    # ssl_certificate     /etc/ssl/certs/quicklinks.crt;
    # ssl_certificate_key /etc/ssl/private/quicklinks.key;

    root /var/www/quicklinks;
    index index.html;

    # Only allow internal networks. Adjust to match your LAN / VPN ranges.
    # allow 10.0.0.0/8;
    # allow 172.16.0.0/12;
    # allow 192.168.0.0/16;
    # deny all;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self'; font-src 'self'; script-src 'self'; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;

    location / {
        try_files $uri $uri/ =404;
        # Files aren't fingerprinted, so make browsers check for changes.
        add_header Cache-Control "no-cache" always;
    }

    # Fonts never change.
    location /assets/fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # Never serve repo internals if they get copied over by accident.
    location ~ ^/(scripts|deploy)/ { deny all; }
    location ~ /\.            { deny all; }
    location ~ \.md$          { deny all; }
}
